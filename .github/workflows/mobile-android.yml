name: Mobile Android

# Gera o APK de teste (debug) a cada alteração no jogo ou no projeto de celular.
# Para o pacote de loja (.aab assinado), cadastre os segredos descritos em sertao-fight-brasil/mobile/README.md
# e rode este fluxo à mão (Actions ▸ Mobile Android ▸ Run workflow) marcando "release".
on:
  push:
    branches: [claude/fighting-game-brasil-dwr0qv, main]
    paths:
      - 'sertao-fight-brasil/mobile/**'
      - 'sertao-fight-brasil/js/**'
      - 'sertao-fight-brasil/css/**'
      - 'sertao-fight-brasil/index.html'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Gerar também o pacote de loja assinado (.aab)'
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sertao-fight-brasil/mobile
    env:
      SFB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sertao-fight-brasil/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Dependências
        run: npm ci
      - name: Jogo web -> app
        run: |
          node scripts/sync-web.js
          npx cap sync android
          node scripts/patch-native.js
      - name: APK de teste (debug)
        working-directory: sertao-fight-brasil/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sertao-fight-brasil-android-debug
          path: sertao-fight-brasil/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Pacote de loja assinado (.aab)
        if: ${{ github.event.inputs.release == 'true' }}
        working-directory: sertao-fight-brasil/mobile/android
        env:
          SFB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SFB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SFB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Faltam os segredos de assinatura (veja mobile/README.md)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SFB_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.release == 'true' }}
        with:
          name: sertao-fight-brasil-android-release-aab
          path: sertao-fight-brasil/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
