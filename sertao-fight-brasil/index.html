<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SERTÃO FIGHT BRASIL — A Rinha Nunca Para</title>
<meta name="description" content="Sertão Fight Brasil: jogo de luta brasileiro em xilogravura. Quem tem energia, manda na rinha. Jogue no navegador: teclado, toque ou controle.">
<meta name="theme-color" content="#141210">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Sertão Fight Brasil">
<meta property="og:description" content="Jogo de luta brasileiro em xilogravura. A rinha nunca para.">
<meta property="og:image" content="store/key-art-1920x1080.png">
<link rel="preload" href="fonts/AlfaSlabOne-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/SpecialElite-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <canvas id="post" width="960" height="540" aria-hidden="true"></canvas>
    <div id="ui"></div>
  </div>
  <button id="fs" title="Tela cheia" aria-label="Tela cheia">⛶</button>
  <div id="rotate"><div>↻<br>Vire o celular<br><small>SERTÃO FIGHT BRASIL joga melhor na horizontal</small></div></div>
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <div class="tbtn up" data-act="up">▲</div>
      <div class="tbtn left" data-act="left">◀</div>
      <div class="tbtn right" data-act="right">▶</div>
      <div class="tbtn down" data-act="down">▼</div>
    </div>
    <div class="btns">
      <div class="tbtn a l" data-act="light">LEVE</div>
      <div class="tbtn a h" data-act="heavy">FORTE</div>
      <div class="tbtn a s" data-act="special">ESP.</div>
      <div class="tbtn a g" data-act="ginga">ARREDA</div>
      <div class="tbtn a m" data-act="mandinga">PEIA</div>
      <div class="tbtn a t" data-act="taunt">PROVOCA</div>
      <div class="tbtn a th" data-act="throw">AGARRA</div>
    </div>
    <div class="tbtn pause" data-act="pause">II</div>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/i18n.js"></script>

<script src="js/stages.js"></script>

<script src="js/ai.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
<script src="js/logo.js"></script>
<script src="js/ui.js"></script>
<script src="js/paint.js"></script>
<script src="js/main.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !window.steam) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
