<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MANDINGA — A Roda Nunca Para</title>
<meta name="description" content="Jogo de luta brasileiro em xilogravura. Quem tem axé, manda na roda. Jogue no navegador: teclado, toque ou controle.">
<meta name="theme-color" content="#141210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui"></div>
  </div>
  <button id="fs" title="Tela cheia" aria-label="Tela cheia">⛶</button>
  <div id="rotate"><div>↻<br>Vire o celular<br><small>MANDINGA joga melhor na horizontal</small></div></div>
  <div id="touch" aria-hidden="true">
    <div class="pad">
      <div class="tbtn up" data-act="up">▲</div>
      <div class="tbtn left" data-act="left">◀</div>
      <div class="tbtn right" data-act="right">▶</div>
      <div class="tbtn down" data-act="down">▼</div>
    </div>
    <div class="btns">
      <div class="tbtn a l" data-act="light">LEVE</div>
      <div class="tbtn a h" data-act="heavy">FORTE</div>
      <div class="tbtn a s" data-act="special">ESP.</div>
      <div class="tbtn a g" data-act="ginga">GINGA</div>
      <div class="tbtn a m" data-act="mandinga">MANDINGA</div>
      <div class="tbtn a t" data-act="taunt">PROVOCA</div>
    </div>
    <div class="tbtn pause" data-act="pause">II</div>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/fighters.js"></script>
<script src="js/poses.js"></script>
<script src="js/render.js"></script>
<script src="js/stages.js"></script>
<script src="js/fighter.js"></script>
<script src="js/ai.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
